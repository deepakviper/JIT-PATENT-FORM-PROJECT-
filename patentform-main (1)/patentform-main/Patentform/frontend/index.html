<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patent Fillers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        const backendUrl = "%VITE_API_URL%";
        if (backendUrl && !backendUrl.startsWith('%') && backendUrl.trim() !== '') {
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
            if (typeof input === 'string' && input.startsWith('http://localhost:8080')) {
              input = input.replace('http://localhost:8080', backendUrl);
            }
            return originalFetch(input, init);
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
